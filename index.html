<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>DecibelCut — Free Audio Silence Remover</title>
    <meta name="description" content="DecibelCut is a free, privacy-first audio editor that automatically removes silent gaps and dead air from your recordings locally in the browser." />
    <meta name="keywords" content="audio silence remover, remove dead air, podcast editor, audio trimmer, silence detection, web audio editor, free audio tool" />

    <!-- Open Graph -->
    <meta property="og:title" content="DecibelCut — Free Audio Silence Remover" />
    <meta property="og:description" content="Automatically remove silence from podcasts, audiobooks and recordings. Free, private, browser-based." />
    <meta property="og:type" content="website" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Theme -->
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark light" />

    <!-- Prevent Flash of White -->
    <style>
      html, body { background: #0a0a0f; }
    </style>

    <!-- JSON-LD Structured Data for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "DecibelCut",
      "operatingSystem": "All",
      "applicationCategory": "MultimediaApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Free, privacy-first audio editor that automatically removes silent gaps and dead air from recordings locally in the browser.",
      "browserRequirements": "Requires Web Audio API and WebAssembly."
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
